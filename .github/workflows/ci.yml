name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # PostgreSQL e' il database di sviluppo: la matrice PHP verifica le due
  # versioni supportate.
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PostgreSQL / PHP ${{ matrix.php }}

    # I test d'integrazione leggono da un database vero: le migrazioni creano
    # lo schema e tests/fixtures/ci_seed.sql i dati minimi. Senza, quei test si
    # saltano e la suite resta verde senza aver mai generato un PDF, un XML
    # FatturaPA o aperto il portale.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoiceplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      # I valori finiscono in .env e non in variabili d'ambiente: CodeIgniter
      # legge il .env per primo e le variabili di processo non lo scavalcano.
      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = postgres
          database.default.password = postgres
          database.default.DBDriver = Postgre
          database.default.port = 5432
          EOF

      # Senza chiave l'app registra errori di decrypt_secret durante i test:
      # non fanno fallire la suite, ma rendono il log del CI inutilizzabile.
      # Le cartelle di writable/ sono versionate con un segnaposto, altrimenti
      # spark termina senza messaggi gia' al primo comando.
      - name: Genera la chiave di cifratura
        run: php spark key:generate

      # Due passi distinti: prima lo schema dalle migrazioni, poi i dati. Se la
      # fixture non si applica il passo fallisce qui, invece di far saltare i
      # test e sembrare tutto a posto.
      - name: Crea lo schema di prova
        run: php spark migrate

      - name: Popola i dati di prova
        run: psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -f tests/fixtures/ci_seed.sql
        env:
          PGPASSWORD: postgres

      # Un test che si salta non fa fallire PHPUnit, e per mesi i test
      # d'integrazione sono stati "verdi" senza aver verificato niente. PHPUnit
      # 13 non ha un --fail-on-skipped, quindi la guardia sta qui: se il
      # risultato contiene dei salti il passo fallisce.
      - name: Esegue i test
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage 2>&1 | tee phpunit.log
          if grep -q 'Skipped:' phpunit.log; then
            echo "Alcuni test si sono saltati: vedi l'elenco qui sopra."
            exit 1
          fi
        env:
          IP_PDF_TEST_DB: invoiceplus_test

  # Il secondo motore: le migrazioni hanno rami per MySQLi e l'app gira anche
  # su MariaDB, ma finche' non lo esegue nessuno quei rami restano teoria.
  # Un solo PHP: qui la variabile da coprire e' il database, non la versione.
  mysql:
    runs-on: ubuntu-latest
    name: MariaDB / PHP 8.5

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: invoiceplus_test
          MARIADB_USER: invoiceplus
          MARIADB_PASSWORD: invoiceplus
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, mysqli, pdo_mysql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = invoiceplus
          database.default.password = invoiceplus
          database.default.DBDriver = MySQLi
          database.default.port = 3306
          EOF

      - name: Genera la chiave di cifratura
        run: php spark key:generate

      - name: Crea lo schema di prova
        run: php spark migrate

      # Fixture separata: quella PostgreSQL usa generate_series(), UPDATE ...
      # FROM e TRUNCATE ... CASCADE, che MariaDB non accetta. I valori sono gli
      # stessi; ci_seed_mysql.sql va aggiornata insieme all'altra.
      - name: Popola i dati di prova
        run: mysql -h 127.0.0.1 -u invoiceplus -pinvoiceplus --default-character-set=utf8mb4 invoiceplus_test < tests/fixtures/ci_seed_mysql.sql

      - name: Esegue i test
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage 2>&1 | tee phpunit.log
          if grep -q 'Skipped:' phpunit.log; then
            echo "Alcuni test si sono saltati: vedi l'elenco qui sopra."
            exit 1
          fi
        env:
          IP_PDF_TEST_DB: invoiceplus_test

  # Controlli che non hanno bisogno di un database: tipi e metodi inesistenti,
  # variabili non assegnate, advisories note nelle dipendenze. Girano su un PHP
  # solo perche' il risultato non dipende dalla versione.
  qualita:
    runs-on: ubuntu-latest
    name: Analisi statica / PHP 8.5

    steps:
      - uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      # Le cartelle di writable/ sono versionate con un segnaposto: senza,
      # spark termina senza messaggi gia' al primo comando. PHPStan non lo
      # esegue, ma la chiave serve se in futuro si aggiungono passi con spark.
      - name: Genera la chiave di cifratura
        run: php spark key:generate

      # Livello 3: funzioni, classi e metodi inesistenti, costanti non
      # definite, tipi di ritorno sbagliati. I livelli successivi chiedono i
      # generics dei model di CodeIgniter, che qui non ci sono.
      - name: Analisi statica
        run: composer analyse

      # Fallisce se una dipendenza ha un advisory noto: e' l'unico controllo
      # che si accorge di una vulnerabilita' corretta a monte.
      - name: Verifica le dipendenze
        run: composer audit --locked

  # La copertura non era misurata: `--no-coverage` in tutti i job teneva la CI
  # veloce ma lasciava invisibile quanto codice nessun test tocca. Qui si
  # produce il clover, si stampa il riepilogo e una soglia minima impedisce un
  # crollo silenzioso.
  copertura:
    runs-on: ubuntu-latest
    name: Copertura / PHP 8.5

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoiceplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: pcov

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = postgres
          database.default.password = postgres
          database.default.DBDriver = Postgre
          database.default.port = 5432
          EOF

      - name: Genera la chiave di cifratura
        run: php spark key:generate

      - name: Crea lo schema di prova
        run: php spark migrate

      - name: Popola i dati di prova
        run: psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -f tests/fixtures/ci_seed.sql
        env:
          PGPASSWORD: postgres

      - name: Esegue i test con la copertura
        run: |
          set -o pipefail
          vendor/bin/phpunit --coverage-clover build/logs/clover.xml 2>&1 | tee phpunit.log
          if grep -q 'Skipped:' phpunit.log; then
            echo "Alcuni test si sono saltati: la copertura non vale."
            exit 1
          fi
        env:
          IP_PDF_TEST_DB: invoiceplus_test

      # Soglia sotto il valore attuale di proposito: deve cogliere un crollo,
      # non trasformare ogni refactoring in un negoziato.
      - name: Verifica la soglia di copertura
        run: php tools/coverage_gate.php 45

      - name: Conserva il report di copertura
        uses: actions/upload-artifact@v4
        with:
          name: copertura
          path: build/logs/clover.xml
          retention-days: 14

  # Il JavaScript (tema, ricerca nelle liste, scorciatoie) non passa da
  # PHPUnit. Playwright guida Chrome sull'applicazione avviata da `spark
  # serve`: e' l'unico job che accorge di una regressione solo lato browser.
  browser:
    runs-on: ubuntu-latest
    name: Browser / PHP 8.5

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoiceplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Le sessioni e la cache usano Redis (Predis) anche in sviluppo: senza
      # questo servizio il primo POST del browser non conserva la sessione e
      # il login end-to-end fallisce per un motivo che non c'entra col codice.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = postgres
          database.default.password = postgres
          database.default.DBDriver = Postgre
          database.default.port = 5432
          EOF

      - name: Genera la chiave di cifratura
        run: php spark key:generate

      - name: Crea lo schema di prova
        run: php spark migrate

      - name: Popola i dati di prova
        run: psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -f tests/fixtures/ci_seed.sql
        env:
          PGPASSWORD: postgres

      # La password del seed non e' nota: qui si imposta quella dei test.
      # L'hash bcrypt contiene "$", quindi passa da una variabile psql e non
      # dal testo della shell.
      - name: Imposta la password dell'utente di prova
        run: |
          HASH=$(php -r 'echo password_hash("e2e-password", PASSWORD_DEFAULT);')
          psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -v hash="$HASH" <<'SQL'
          UPDATE ip_users SET user_password = :'hash', user_mfa_enabled = false WHERE user_id = 1;
          SQL
        env:
          PGPASSWORD: postgres

      - name: Installa Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      - name: Installa Playwright
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Esegue i test nel browser
        working-directory: tests/browser
        run: npx playwright test
        env:
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: e2e-password

      - name: Conserva il report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/browser/playwright-report/
          retention-days: 7
