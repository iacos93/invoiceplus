name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cache dei job
#
# Ogni job mette in cache `vendor/`. La chiave porta il lock e la versione di
# PHP, quindi una dipendenza cambiata invalida la cache da sola e `composer
# install` fa il suo lavoro invece di fidarsi di un albero vecchio.
#
# I pacchetti di sistema (`/var/cache/apt/archives`) NON sono in cache, e non
# per svista: c'erano, e la misura sui run del 12 e 14 novembre 2026 le ha
# bocciate. `setup-php` impiega 3-4 secondi e `composer install` 3-5, quindi
# ripristinare e risalvare decine di MB di .deb costa quanto il download che
# toglie (e `apt-get update` resta in ogni caso). Il tempo dei job non sta lì:
# sta nei 20-23 secondi di `Initialize containers` che ogni job con servizi
# paga per avviare Postgres, MariaDB o Redis, e nei 20 secondi di `Installa
# Playwright` del job del browser. Prima di rimetterla, misuri di nuovo: le
# durate per passo sono nei log di ogni esecuzione.
#
# Nel job del browser si cacheano invece i browser di Playwright
# (`~/.cache/ms-playwright`): lì il download è di ~170 MB e il passo che lo fa
# dura 20 s, quindi la cache ripaga. Le librerie di sistema che
# `playwright install --with-deps` aggiunge restano fuori: finiscono in /usr.

jobs:
  # PostgreSQL e' il database di sviluppo: la matrice PHP verifica le due
  # versioni supportate.
  postgres:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    name: PostgreSQL / PHP ${{ matrix.php }}

    # I test d'integrazione leggono da un database vero: le migrazioni creano
    # lo schema e tests/fixtures/ci_seed.sql i dati minimi. Senza, quei test si
    # saltano e la suite resta verde senza aver mai generato un PDF, un XML
    # FatturaPA o aperto il portale.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoiceplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Cache delle dipendenze: la chiave porta il lock e la versione di PHP,
      # quindi una dipendenza cambiata la invalida da sola. La nota «Cache dei
      # job» è in testa al file, col motivo per cui i pacchetti di sistema non
      # si cacheano.
      - name: Recupera le dipendenze dalla cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-${{ runner.os }}-php${{ matrix.php }}-

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      # I valori finiscono in .env e non in variabili d'ambiente: CodeIgniter
      # legge il .env per primo e le variabili di processo non lo scavalcano.
      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = postgres
          database.default.password = postgres
          database.default.DBDriver = Postgre
          database.default.port = 5432
          EOF

      # Senza chiave l'app registra errori di decrypt_secret durante i test:
      # non fanno fallire la suite, ma rendono il log del CI inutilizzabile.
      # Le cartelle di writable/ sono versionate con un segnaposto, altrimenti
      # spark termina senza messaggi gia' al primo comando.
      - name: Genera la chiave di cifratura
        run: php spark key:generate

      # Due passi distinti: prima lo schema dalle migrazioni, poi i dati. Se la
      # fixture non si applica il passo fallisce qui, invece di far saltare i
      # test e sembrare tutto a posto.
      - name: Crea lo schema di prova
        run: php spark migrate

      - name: Popola i dati di prova
        run: psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -f tests/fixtures/ci_seed.sql
        env:
          PGPASSWORD: postgres

      # pdftotext (poppler-utils) serve ai test che leggono il testo del PDF
      # generato: senza, si saltano, e un salto fa fallire il passo dei test.
      - name: Installa pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      # Un test che si salta non fa fallire PHPUnit, e per mesi i test
      # d'integrazione sono stati "verdi" senza aver verificato niente. PHPUnit
      # 13 non ha un --fail-on-skipped, quindi la guardia sta qui: se il
      # risultato contiene dei salti il passo fallisce.
      - name: Esegue i test
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage 2>&1 | tee phpunit.log
          if grep -q 'Skipped:' phpunit.log; then
            echo "Alcuni test si sono saltati: vedi l'elenco qui sopra."
            exit 1
          fi
        env:
          IP_PDF_TEST_DB: invoiceplus_test

  # Il secondo motore: le migrazioni hanno rami per MySQLi e l'app gira anche
  # su MariaDB, ma finche' non lo esegue nessuno quei rami restano teoria.
  # Un solo PHP: qui la variabile da coprire e' il database, non la versione.
  mysql:
    runs-on: ubuntu-latest
    name: MariaDB / PHP 8.5

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: invoiceplus_test
          MARIADB_USER: invoiceplus
          MARIADB_PASSWORD: invoiceplus
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      # Cache delle dipendenze: la chiave porta il lock e la versione di PHP,
      # quindi una dipendenza cambiata la invalida da sola. La nota «Cache dei
      # job» è in testa al file, col motivo per cui i pacchetti di sistema non
      # si cacheano.
      - name: Recupera le dipendenze dalla cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-${{ runner.os }}-php8.5-

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, mysqli, pdo_mysql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = invoiceplus
          database.default.password = invoiceplus
          database.default.DBDriver = MySQLi
          database.default.port = 3306
          EOF

      - name: Genera la chiave di cifratura
        run: php spark key:generate

      - name: Crea lo schema di prova
        run: php spark migrate

      # Fixture separata: quella PostgreSQL usa generate_series(), UPDATE ...
      # FROM e TRUNCATE ... CASCADE, che MariaDB non accetta. I valori sono gli
      # stessi; ci_seed_mysql.sql va aggiornata insieme all'altra.
      - name: Popola i dati di prova
        run: mysql -h 127.0.0.1 -u invoiceplus -pinvoiceplus --default-character-set=utf8mb4 invoiceplus_test < tests/fixtures/ci_seed_mysql.sql

      # pdftotext (poppler-utils) serve ai test che leggono il testo del PDF
      # generato: senza, si saltano, e un salto fa fallire il passo dei test.
      - name: Installa pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Esegue i test
        run: |
          set -o pipefail
          vendor/bin/phpunit --no-coverage 2>&1 | tee phpunit.log
          if grep -q 'Skipped:' phpunit.log; then
            echo "Alcuni test si sono saltati: vedi l'elenco qui sopra."
            exit 1
          fi
        env:
          IP_PDF_TEST_DB: invoiceplus_test

  # Controlli che non hanno bisogno di un database: tipi e metodi inesistenti,
  # variabili non assegnate, advisories note nelle dipendenze. Girano su un PHP
  # solo perche' il risultato non dipende dalla versione.
  qualita:
    runs-on: ubuntu-latest
    name: Analisi statica / PHP 8.5

    steps:
      - uses: actions/checkout@v5

      # Cache delle dipendenze: la chiave porta il lock e la versione di PHP,
      # quindi una dipendenza cambiata la invalida da sola. La nota «Cache dei
      # job» è in testa al file, col motivo per cui i pacchetti di sistema non
      # si cacheano.
      - name: Recupera le dipendenze dalla cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-${{ runner.os }}-php8.5-

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      # Le cartelle di writable/ sono versionate con un segnaposto: senza,
      # spark termina senza messaggi gia' al primo comando. PHPStan non lo
      # esegue, ma la chiave serve se in futuro si aggiungono passi con spark.
      - name: Genera la chiave di cifratura
        run: php spark key:generate

      # Livello 5, con phpstan-baseline.neon per i 35 rilievi gia' esaminati
      # nel codice precedente: un rilievo nuovo fa fallire il passo. Oltre il
      # 5 servirebbero i generics dei model di CodeIgniter, che qui non ci
      # sono.
      - name: Analisi statica
        run: composer analyse

      # Gli script della prova locale non sono PHP: senza un controllo, un
      # errore di sintassi si scopre solo quando qualcuno li lancia. Qui si
      # leggono senza eseguirli. PowerShell e' presente anche sui runner Linux.
      - name: Verifica gli script di prova locale
        shell: pwsh
        run: |
          bash -n tools/quickstart/quickstart.sh
          $errori = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/quickstart/quickstart.ps1", [ref]$null, [ref]$errori) | Out-Null
          if ($errori) { $errori | Format-List; exit 1 }

      # `deploy.sh` e `rollback.sh` girano sul server, dove un errore si paga
      # con un aggiornamento a metà o un rollback che non parte. La sintassi si
      # controlla sempre; il rollback si esegue anche per intero su repository
      # finti, con `php` e `composer` sostituiti da stub: è l'unico modo per
      # sapere che l'ordine dei passi e i controlli sono quelli che il messaggio
      # racconta, senza un server vero.
      - name: Verifica gli script di deploy e rollback
        run: |
          bash -n tools/deploy.sh tools/rollback.sh
          bash tools/tests/rollback_harness.sh

      # Fallisce se una dipendenza ha un advisory noto: e' l'unico controllo
      # che si accorge di una vulnerabilita' corretta a monte.
      - name: Verifica le dipendenze
        run: composer audit --locked

  # Compressione e cache degli asset vivono in public/.htaccess, e i test della
  # suite non le attraversano mai: `php spark serve` non legge il file e qui non
  # c'è nessun Apache. Le regole del file le controlla
  # tests/unit/HtaccessAssetRulesTest.php; gli header che ne escono li produce
  # solo un Apache vero, ed è quello che si prova qui.
  #
  # Il job serve i soli file statici (`--solo-statico`): dentro Apache non c'è
  # PHP, che richiederebbe anche un database per la pagina di accesso. Il test
  # di quella pagina si salta con un messaggio che dice perché, e la prova
  # completa si lancia in locale con `php tools/apache_headers_check.php`
  # (avvia anche php-fpm). Gli asset e la regola «le pagine non si cacheano»
  # sono verificati lo stesso.
  intestazioni-apache:
    runs-on: ubuntu-latest
    name: Intestazioni Apache / PHP 8.4

    steps:
      - uses: actions/checkout@v5

      # Cache delle dipendenze: la chiave porta il lock e la versione di PHP,
      # quindi una dipendenza cambiata la invalida da sola. La nota «Cache dei
      # job» è in testa al file, col motivo per cui i pacchetti di sistema non
      # si cacheano.
      - name: Recupera le dipendenze dalla cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.4-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-${{ runner.os }}-php8.4-

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      # Un .env e una chiave come negli altri job: PHPUnit carica il framework
      # e senza chiave basta che un test sfiori l'encrypter per farlo fallire
      # con un errore che parla d'altro. Non servono né database né Redis: il
      # test di questo job non tocca il database.
      - name: Configura l'ambiente
        run: |
          cp env .env
          php spark key:generate

      # apache2 su Ubuntu porta mod_deflate, mod_expires, mod_headers e
      # mod_rewrite come moduli: lo script li carica per percorso assoluto,
      # quindi non serve a2enmod. Il servizio di sistema non parte sui runner
      # (non c'è systemd), e comunque lo script avvia un httpd suo su una porta
      # libera: quello di sistema non viene toccato.
      - name: Installa Apache
        run: sudo apt-get update && sudo apt-get install -y apache2

      - name: Compressione e cache degli asset
        run: php tools/apache_headers_check.php --solo-statico

  # La copertura non era misurata: `--no-coverage` in tutti i job teneva la CI
  # veloce ma lasciava invisibile quanto codice nessun test tocca. Qui si
  # produce il clover, si stampa il riepilogo e una soglia minima impedisce un
  # crollo silenzioso.
  copertura:
    runs-on: ubuntu-latest
    name: Copertura / PHP 8.5

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoiceplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Cache delle dipendenze: la chiave porta il lock e la versione di PHP,
      # quindi una dipendenza cambiata la invalida da sola. La nota «Cache dei
      # job» è in testa al file, col motivo per cui i pacchetti di sistema non
      # si cacheano.
      - name: Recupera le dipendenze dalla cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-${{ runner.os }}-php8.5-

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: pcov

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = postgres
          database.default.password = postgres
          database.default.DBDriver = Postgre
          database.default.port = 5432
          EOF

      - name: Genera la chiave di cifratura
        run: php spark key:generate

      - name: Crea lo schema di prova
        run: php spark migrate

      - name: Popola i dati di prova
        run: psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -f tests/fixtures/ci_seed.sql
        env:
          PGPASSWORD: postgres

      # pdftotext (poppler-utils) serve ai test che leggono il testo del PDF
      # generato: senza, si saltano, e un salto fa fallire il passo dei test.
      - name: Installa pdftotext
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Esegue i test con la copertura
        run: |
          set -o pipefail
          vendor/bin/phpunit --coverage-clover build/logs/clover.xml 2>&1 | tee phpunit.log
          if grep -q 'Skipped:' phpunit.log; then
            echo "Alcuni test si sono saltati: la copertura non vale."
            exit 1
          fi
        env:
          IP_PDF_TEST_DB: invoiceplus_test

      # Soglia sotto il valore attuale di proposito: deve cogliere un crollo,
      # non trasformare ogni refactoring in un negoziato.
      - name: Verifica la soglia di copertura
        run: php tools/coverage_gate.php 45

      - name: Conserva il report di copertura
        uses: actions/upload-artifact@v6
        with:
          name: copertura
          path: build/logs/clover.xml
          retention-days: 14

  # Il JavaScript (tema, ricerca nelle liste, scorciatoie) non passa da
  # PHPUnit. Playwright guida Chrome sull'applicazione avviata da `spark
  # serve`: e' l'unico job che accorge di una regressione solo lato browser.
  browser:
    runs-on: ubuntu-latest
    name: Browser / PHP 8.5

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: invoiceplus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Le sessioni e la cache usano Redis (Predis) anche in sviluppo: senza
      # questo servizio il primo POST del browser non conserva la sessione e
      # il login end-to-end fallisce per un motivo che non c'entra col codice.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      # Cache delle dipendenze: la chiave porta il lock e la versione di PHP,
      # quindi una dipendenza cambiata la invalida da sola. La nota «Cache dei
      # job» è in testa al file, col motivo per cui i pacchetti di sistema non
      # si cacheano.
      - name: Recupera le dipendenze dalla cache
        uses: actions/cache@v5
        with:
          path: vendor
          key: vendor-${{ runner.os }}-php8.5-${{ hashFiles('composer.lock') }}
          restore-keys: |
            vendor-${{ runner.os }}-php8.5-

      - name: Installa PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl, mbstring, json, curl, gd, zip, pdo_sqlite, sqlite3, pgsql, pdo_pgsql
          coverage: none

      - name: Installa le dipendenze
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configura l'ambiente
        run: |
          cp env .env
          cat >> .env <<'EOF'
          database.default.hostname = 127.0.0.1
          database.default.database = invoiceplus_test
          database.default.username = postgres
          database.default.password = postgres
          database.default.DBDriver = Postgre
          database.default.port = 5432
          EOF

      - name: Genera la chiave di cifratura
        run: php spark key:generate

      - name: Crea lo schema di prova
        run: php spark migrate

      - name: Popola i dati di prova
        run: psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -f tests/fixtures/ci_seed.sql
        env:
          PGPASSWORD: postgres

      # La password del seed non e' nota: qui si imposta quella dei test.
      # L'hash bcrypt contiene "$", quindi passa da una variabile psql e non
      # dal testo della shell.
      - name: Imposta la password dell'utente di prova
        run: |
          HASH=$(php -r 'echo password_hash("e2e-password", PASSWORD_DEFAULT);')
          psql -h 127.0.0.1 -U postgres -d invoiceplus_test -v ON_ERROR_STOP=1 -v hash="$HASH" <<'SQL'
          UPDATE ip_users SET user_password = :'hash', user_mfa_enabled = false WHERE user_id = 1;
          SQL
        env:
          PGPASSWORD: postgres

      - name: Installa Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json

      # Chromium per Playwright sono ~170 MB, e senza cache si riscaricano a
      # ogni esecuzione: è il passo più lento del job (20 s misurati sul run del
      # 14 novembre). La chiave è il lock di tests/browser, dove sta la versione
      # di @playwright/test: quando cambia, la cache non si usa e Playwright
      # riscarica. Se la cache contiene una versione diversa da quella che gli
      # serve, `playwright install` installa solo ciò che manca — quindi una
      # cache vecchia costa un download parziale, non un errore.
      #
      # Restano fuori le librerie di sistema di `--with-deps` (libnss, ffmpeg e
      # compagne): finiscono in /usr e non si cacheano. Vedi la nota in testa al
      # file.
      - name: Recupera i browser di Playwright dalla cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/browser/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Installa Playwright
        working-directory: tests/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Esegue i test nel browser
        working-directory: tests/browser
        run: npx playwright test
        env:
          E2E_EMAIL: admin@example.com
          E2E_PASSWORD: e2e-password

      - name: Conserva il report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: tests/browser/playwright-report/
          retention-days: 7
