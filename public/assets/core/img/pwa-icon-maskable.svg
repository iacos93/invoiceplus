<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Invoice+">
  <title>Invoice+</title>
  <!-- Icona «maskable»: Android la ritaglia con la forma del tema (tondo,
       goccia, quadrotto) e può tagliare fino al 20% per lato, quindi il segno
       sta dentro il 72% centrale su un fondo blu pieno, senza trasparenza ai
       bordi. Stesso disegno e stesso ricentraggio di pwa-icon.svg — la croce
       che sborda in basso a destra sposta il gruppo, qui corretto di
       (-1.8, -2) in unità del segno. -->
  <rect width="512" height="512" fill="#1E73B8"/>
  <g transform="translate(71.7 71.7) scale(16.756)">
    <rect x="0" y="0" width="22" height="22" rx="6" fill="#1E73B8"/>
    <g transform="translate(-1.8 -2)">
      <rect x="5.4" y="5.6" width="13.2" height="2.5" rx="1.25" fill="#fff"/>
      <rect x="5.4" y="10.2" width="7.4" height="2.5" rx="1.25" fill="#fff" opacity=".8"/>
      <rect x="5.4" y="14.8" width="4.2" height="2.5" rx="1.25" fill="#fff" opacity=".6"/>
      <path fill="#9FD3FA" d="M14.5 11.6h2.6v3.1h3.1v2.6h-3.1v3.1h-2.6v-3.1h-3.1v-2.6h3.1Z"/>
    </g>
  </g>
</svg>
