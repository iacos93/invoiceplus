<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Invoice+">
  <title>Invoice+</title>
  <!-- Segno del progetto: un foglio con l'angolo in alto a destra piegato
       (il documento, la fattura) e un "+" in un tondo scuro sull'angolo in
       basso a destra, che è la parte "plus" del nome. Tre toni di blu, gli
       stessi tre della vecchia identità, così il marchio resta leggibile sia
       sul navy della barra sia sul chiaro della colonna del menu. -->
  <path fill="#429AE1" d="M5.75 2h7.95L20 8.3v10.2A2.5 2.5 0 0 1 17.5 21H5.75A2.75 2.75 0 0 1 3 18.25V4.75A2.75 2.75 0 0 1 5.75 2Z"/>
  <path fill="#2181CE" d="M13.7 2 20 8.3h-4.6a1.7 1.7 0 0 1-1.7-1.7Z"/>
  <rect x="6.2" y="10.6" width="7.4" height="1.5" rx=".75" fill="#fff" opacity=".85"/>
  <rect x="6.2" y="14" width="4.6" height="1.5" rx=".75" fill="#fff" opacity=".85"/>
  <circle cx="17.4" cy="17.4" r="5" fill="#1E73B8" stroke="#fff" stroke-width="1.2"/>
  <path fill="#fff" d="M16.5 14.4h1.8v2.1h2.1v1.8h-2.1v2.1h-1.8v-2.1h-2.1v-1.8h2.1Z"/>
</svg>
