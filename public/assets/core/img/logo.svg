    <path fill="#429AE1" d="M5.75 2h7.95L20 8.3v10.2A2.5 2.5 0 0 1 17.5 21H5.75A2.75 2.75 0 0 1 3 18.25V4.75A2.75 2.75 0 0 1 5.75 2Z"/>
