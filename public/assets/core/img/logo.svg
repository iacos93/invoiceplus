    <rect x="6.2" y="14" width="4.6" height="1.5" rx=".75" fill="#fff" opacity=".85"/>
    <circle cx="17.4" cy="17.4" r="5" fill="#1E73B8" stroke="#fff" stroke-width="1.2"/>
    <path fill="#fff" d="M16.5 14.4h1.8v2.1h2.1v1.8h-2.1v2.1h-1.8v-2.1h-2.1v-1.8h2.1Z"/>
