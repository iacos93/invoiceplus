<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200" role="img" aria-label="Invoice+">
  <title>Invoice+</title>
  <!-- Logo per sfondi chiari (README, pagina di benvenuto): il segno a
       sinistra e il nome a destra, con il "+" nel blu del marchio per tenere
       insieme le due parti del nome. Il lettering è testo SVG, non tracciati:
       aperto da solo, senza Sora installato, ricade su un sans di sistema.
       Per questo logo_400x200.png va rigenerato da una pagina che carica
       assets/core/fonts/sora-latin.woff2, non convertendo questo file. -->
  <g transform="translate(66 64) scale(3)">
    <rect x="1" y="1" width="22" height="22" rx="6" fill="#1E73B8"/>
    <rect x="5.4" y="5.6" width="13.2" height="2.5" rx="1.25" fill="#fff"/>
    <rect x="5.4" y="10.2" width="7.4" height="2.5" rx="1.25" fill="#fff" opacity=".8"/>
    <rect x="5.4" y="14.8" width="4.2" height="2.5" rx="1.25" fill="#fff" opacity=".6"/>
    <path fill="#9FD3FA" d="M14.5 11.6h2.6v3.1h3.1v2.6h-3.1v3.1h-2.6v-3.1h-3.1v-2.6h3.1Z"/>
  </g>
  <text x="154" y="114" font-family="Sora, Figtree, 'Helvetica Neue', Arial, sans-serif"
        font-size="40" font-weight="700" letter-spacing="-1.2" fill="#18181b">Invoice</text>
  <path d="M306.5 100h21M317 89.5v21" fill="none" stroke="#2181CE" stroke-width="8" stroke-linecap="round"/>
</svg>
